name = "missions"
description = "Hand Minty a goal: it plans, works in the background with your tools, checks each step against what really happened, and reports what is done, stuck or needs you."
default_enabled = true

[settings.max_concurrent]
type = "number"
label = "Missions at once (default 2)"

[settings.max_runtime_s]
type = "number"
label = "Max seconds of work per mission (default 7200; time spent waiting for your answer is not counted)"

[settings.max_steps]
type = "number"
label = "Max tool-using steps per mission (default 40)"

[settings.approval_wait_s]
type = "number"
label = "How long a mission waits for your yes to a risky step, in seconds (default 21600, six hours)"
