name = "studio"
description = "Make short videos (voiceover, music, captions, a background clip) and queue them for Instagram. The tools are local; posting needs your own Instagram professional account and token, and by default asks before every post."
default_enabled = true

[settings.ig_user_id]
type = "string"
label = "Instagram account id (the number from the Graph API, for your professional account)"

[settings.ig_host]
type = "string"
label = "graph.instagram.com (default, Instagram login) or graph.facebook.com (Facebook login)"

[settings.ig_token_expires]
type = "string"
label = "When the Instagram token runs out (YYYY-MM-DD), so Minty can warn you a week before"

[settings.post_mode]
type = "string"
label = "ask (default: every post is shown to you first) or auto (clean posts go by themselves, within the limits below)"

[settings.max_posts_per_day]
type = "number"
label = "Most automatic posts a day (default 1)"

[settings.min_gap_hours]
type = "number"
label = "Fewest hours between automatic posts (default 6)"

[settings.blocked_words]
type = "string"
label = "Words that make a caption ask first, comma separated (default: password, bank, giveaway ...)"

[settings.voice]
type = "string"
label = "Voice for voiceovers (default am_michael; others like af_heart, bf_emma)"

[settings.public_dir]
type = "string"
label = "Carousels only: a folder that is served on the internet (Instagram fetches pictures by address)"

[settings.public_base_url]
type = "string"
label = "Carousels only: the https address of that folder, for example https://you.github.io/pics"

[settings.project_dir]
type = "string"
label = "Where Claude Code makes motion graphics (default ~/Documents/project/minty-studio, inside your home folder)"

[settings.preview_to_phone]
type = "boolean"
label = "Send each draft video to your paired Telegram chat so you can see what you are asked to approve (default off)"

[settings.ig_api_version]
type = "string"
label = "Instagram API version (default v26.0, the one Meta's examples use; older ones are retired after about two years)"

[settings.auto_discover]
type = "boolean"
label = "Look for new background footage by itself once a day in the quiet window (default off): NASA needs no key, Pexels and Pixabay use your own keys; a few clips a day, never more than the library limit"

[settings.library_max_mb]
type = "number"
label = "Most megabytes of fetched background footage to keep (default 1500); the least recently shown go first, never your own"

[settings.min_clips_per_style]
type = "number"
label = "A style with fewer clips than this is skipped for one with more (default 3)"
