[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minty-core"
version = "1.0.2"
description = "Minty: a voice assistant that runs on your own computer, works with the AI providers you choose, and asks before it acts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["voice-assistant", "ai-agent", "llm", "telegram", "self-hosted", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pydantic>=2.5",
  "httpx>=0.27",
  "certifi>=2026.10.18",  # older releases: PYSEC-2026-4320 (found by pip-audit, 2026-10-28)
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=14",  # 14+: connect() takes additional_headers (the panel sends the core token in a header)
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
  "numpy>=1.24",
  "rich>=13",
]

[project.optional-dependencies]
voice = ["filelock>=4.2.1", "sounddevice>=0.4.6", "onnxruntime>=1.16", "faster-whisper>=1.0", "piper-tts>=1.3", "kokoro-onnx>=0.4", "google-genai>=1.0"]  # openwakeword: see scripts/install_voice.sh
browser = ["playwright>=1.63"]  # also needs Google Chrome (or: playwright install chromium)
music = ["shazamio>=0.8"]  # "what song is this" (records with parec from pulseaudio-utils)
backup = ["cryptography>=42"]  # encrypted backups (AES-GCM + scrypt); also installed by some other packages
ptt = ["pynput>=1.7"]  # a global push-to-talk key (506); without it the panel button and the API still work
documents = ["pypdf>=4"]  # read text PDFs sent through Telegram (544); pictures need tesseract (system package)
local-llm = ["llama-cpp-python>=0.2.90"]  # optional, experimental: a small local model for titles/summaries (531)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3"]  # xdist: optional, `pytest -n auto` runs in parallel

[project.scripts]
minty = "minty_core.app:main"
minty-core = "minty_core.app:main"
minty-panel = "minty_panel.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minty_core = ["plugins/builtin/*/plugin.toml", "plugins/builtin/apis/catalog.json", "skills_builtin/*/SKILL.md",
               "prompts_terse.json", "MINTY_IDENTITY.md"]
minty_panel = ["static/*", "static/pages/*", "static/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
